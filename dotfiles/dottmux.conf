# tmux configuration for Claude Code pane management
# Preserves pane widths when spawning new vertical splits

# Use largest connected client's window size (prevents auto-redistribute on split)
set -g window-size latest

# Bindings for manual layout control
# Toggle zoom to preserve proportions on unzoom
bind-key -n 'C-z' resize-pane -Z

# Explicitly use main-vertical layout (locks left pane width)
# Uncomment if you want this as default:
# bind-key -n 'C-l' select-layout main-vertical
